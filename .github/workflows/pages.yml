name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main branch root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          repo="${{ github.repository }}"
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          if ! gh api "repos/${repo}/pages" >/dev/null 2>&1; then
            gh api --method POST "repos/${repo}/pages" --input - <<<"$payload"
          fi
          gh api --method PUT "repos/${repo}/pages" --input - <<<"$payload"
          gh api "repos/${repo}/pages" --jq '{html_url,build_type,source,status}'
